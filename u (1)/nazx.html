<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>Nazx — Kirim Getar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0A0C10;
    --surface:#14171D;
    --surface-2:#1D2129;
    --volt:#D6FF3F;
    --volt-dim:#8FA82A;
    --pulse:#FF3B6E;
    --pulse-dim:#8A2140;
    --text:#EDEFF3;
    --muted:#6B7280;
    --line:#262B33;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
    -webkit-tap-highlight-color:transparent;
  }
  .app{width:100%;max-width:380px;position:relative;}
  .brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px;}
  .brand h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:26px;letter-spacing:0.5px;margin:0;color:var(--text);}
  .brand h1 span{color:var(--volt);}
  .status-dot{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;font-weight:600;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--volt);}

  .invite-bar{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:18px;
  }
  .invite-bar .txt{font-size:12px;color:var(--muted);line-height:1.4;}
  .invite-bar .you{font-family:'JetBrains Mono',monospace;color:var(--volt);font-weight:700;font-size:12px;}
  .btn-invite{
    background:var(--volt);color:#10130A;border:none;font-family:'Space Grotesk',sans-serif;
    font-weight:700;font-size:12px;padding:9px 14px;border-radius:9px;cursor:pointer;white-space:nowrap;
  }
  .btn-invite:active{transform:scale(0.95);}
  .icon-btn{
    background:var(--surface-2);border:1px solid var(--line);color:var(--muted);
    width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;font-size:14px;flex-shrink:0;
  }
  .icon-btn:active{transform:scale(0.92);}

  .stage{position:relative;display:flex;align-items:center;justify-content:center;height:200px;margin-bottom:4px;}
  .ring{position:absolute;border-radius:50%;border:2px solid var(--volt);opacity:0;pointer-events:none;}
  .ring.recv{border-color:var(--pulse);}
  @keyframes burst{0%{width:112px;height:112px;opacity:0.9;}100%{width:250px;height:250px;opacity:0;}}
  .buzz-btn{
    position:relative;width:112px;height:112px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #E4FF6E, var(--volt) 70%);
    border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;
    box-shadow:0 0 0 1px rgba(214,255,63,0.25);z-index:2;
  }
  .buzz-btn:active{transform:scale(0.94);}
  .buzz-btn .lbl{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:#10130A;letter-spacing:0.02em;}
  .buzz-btn.recv-flash{background:radial-gradient(circle at 35% 30%, #FF7A9E, var(--pulse) 70%);}

  .feed-title{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--muted);font-weight:600;margin:14px 0 8px;}
  .feed{display:flex;flex-direction:column-reverse;gap:6px;max-height:200px;overflow-y:auto;margin-bottom:12px;}
  .feed-empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center;}
  .feed-item{
    display:flex;flex-direction:column;gap:2px;background:var(--surface);border:1px solid var(--line);
    border-radius:10px;padding:9px 12px;font-size:13px;animation:slidein 0.2s ease;
  }
  @keyframes slidein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .feed-item .row1{display:flex;align-items:center;justify-content:space-between;}
  .feed-item .who{font-weight:600;font-size:12px;}
  .feed-item .who.me{color:var(--volt-dim);}
  .feed-item .who.other{color:var(--pulse);}
  .feed-item .when{color:var(--muted);font-size:10px;}
  .feed-item .msg-text{color:var(--text);font-size:13px;line-height:1.4;}
  .feed-item.buzz-type .row1 .who::before{content:"⚡ ";}

  .chat-row{display:flex;gap:8px;}
  .chat-row input{
    flex:1;background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    font-family:'Inter',sans-serif;font-size:14px;padding:11px 13px;border-radius:10px;outline:none;
  }
  .chat-row input:focus{border-color:var(--volt);}
  .btn-send{
    background:var(--surface-2);border:1px solid var(--line);color:var(--volt);
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:13px;
    padding:0 16px;border-radius:10px;cursor:pointer;
  }
  .btn-send:active{transform:scale(0.95);}

  .note{font-size:11px;color:var(--muted);text-align:center;margin-top:14px;line-height:1.5;}
  .flash-overlay{position:fixed;inset:0;background:var(--pulse);opacity:0;pointer-events:none;z-index:50;}
  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--surface-2);border:1px solid var(--line);color:var(--text);
    font-size:12px;padding:9px 16px;border-radius:20px;opacity:0;transition:opacity 0.2s;z-index:60;
  }
</style>
</head>
<body>

<div class="flash-overlay" id="flashOverlay"></div>
<div class="toast" id="toast"></div>

<div class="app">
  <div class="brand">
    <h1>naz<span>x</span></h1>
    <div class="status-dot"><div class="dot"></div><span>terhubung</span></div>
  </div>

  <div class="invite-bar">
    <div class="txt">Kamu: <span class="you" id="youName">—</span><br>Belum ada teman? Kirim link ini.</div>
    <button class="btn-invite" id="inviteBtn">Undang</button>
  </div>

  <div class="stage" id="stage">
    <button class="buzz-btn" id="buzzBtn"><span class="lbl">GETAR!</span></button>
  </div>

  <div class="feed-title">Aktivitas</div>
  <div class="feed" id="feed">
    <div class="feed-empty" id="feedEmpty">Belum ada aktivitas. Undang temanmu lalu pencet GETAR atau kirim pesan.</div>
  </div>

  <div class="chat-row">
    <input type="text" id="msgInput" placeholder="Tulis pesan..." maxlength="200">
    <button class="btn-send" id="sendMsgBtn">Kirim</button>
  </div>

  <p class="note" id="footNote"></p>
</div>

<script>
(function(){
  var nickname = "";
  var roomCode = "";
  var storageKey = "";
  var pollTimer = null;
  var processedIds = {};
  var mySentIds = {};
  var feedItems = [];

  var youNameEl = document.getElementById('youName');
  var inviteBtn = document.getElementById('inviteBtn');
  var buzzBtn = document.getElementById('buzzBtn');
  var stage = document.getElementById('stage');
  var feed = document.getElementById('feed');
  var feedEmpty = document.getElementById('feedEmpty');
  var flashOverlay = document.getElementById('flashOverlay');
  var footNote = document.getElementById('footNote');
  var msgInput = document.getElementById('msgInput');
  var sendMsgBtn = document.getElementById('sendMsgBtn');
  var toast = document.getElementById('toast');

  var CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  var ANIMALS = ["Rubah","Elang","Harimau","Kancil","Merak","Beruang","Serigala","Kucing","Garuda","Musang","Kijang","Camar"];

  function randomCode(){
    var s = "";
    for(var i=0;i<5;i++){ s += CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; }
    return s;
  }
  function randomNickname(){
    var a = ANIMALS[Math.floor(Math.random()*ANIMALS.length)];
    var n = Math.floor(Math.random()*90)+10;
    return a + n;
  }
  function showToast(msg){
    toast.textContent = msg;
    toast.style.opacity = '1';
    setTimeout(function(){ toast.style.opacity = '0'; }, 1800);
  }
  function timeAgo(ts){
    var diff = Math.max(0, Date.now() - ts);
    var s = Math.floor(diff/1000);
    if(s < 5) return 'baru saja';
    if(s < 60) return s + 'd lalu';
    var m = Math.floor(s/60);
    if(m < 60) return m + ' mnt lalu';
    var h = Math.floor(m/60);
    return h + ' jam lalu';
  }

  function init(){
    var params = new URLSearchParams(window.location.search);
    var urlRoom = params.get('room');
    if(urlRoom){
      roomCode = urlRoom.toUpperCase();
    } else {
      roomCode = randomCode();
      try{
        var newUrl = window.location.pathname + '?room=' + roomCode;
        history.replaceState(null, '', newUrl);
      } catch(e){}
    }
    nickname = randomNickname();
    storageKey = 'nazx-room-' + roomCode;
    youNameEl.textContent = nickname;

    if(!('vibrate' in navigator)){
      footNote.textContent = 'HP ini mungkin tidak mendukung getar asli, tapi efek visual & suara tetap terasa.';
    } else {
      footNote.textContent = 'Semua orang yang buka link undangan ini otomatis masuk ke room yang sama.';
    }

    loadInitial();
    pollTimer = setInterval(poll, 1500);
  }

  function inviteLink(){
    return window.location.origin + window.location.pathname + '?room=' + roomCode;
  }

  inviteBtn.addEventListener('click', function(){
    var link = inviteLink();
    if(navigator.share){
      navigator.share({ title: 'Gabung di Nazx', text: 'Yuk gabung, biar bisa saling kirim getar & pesan.', url: link }).catch(function(){});
    } else if(navigator.clipboard){
      navigator.clipboard.writeText(link).then(function(){ showToast('Link disalin'); }).catch(function(){ showToast(link); });
    } else {
      showToast(link);
    }
  });

  function renderFeed(){
    feed.innerHTML = '';
    if(feedItems.length === 0){
      feed.appendChild(feedEmpty);
      return;
    }
    var sorted = feedItems.slice().sort(function(a,b){ return b.ts - a.ts; }).slice(0, 30);
    sorted.forEach(function(ev){
      var isMe = mySentIds[ev.id];
      var row = document.createElement('div');
      row.className = 'feed-item' + (ev.type === 'buzz' ? ' buzz-type' : '');
      var row1 = document.createElement('div');
      row1.className = 'row1';
      var whoSpan = document.createElement('span');
      whoSpan.className = 'who ' + (isMe ? 'me' : 'other');
      whoSpan.textContent = isMe ? 'kamu' : ev.from;
      var whenSpan = document.createElement('span');
      whenSpan.className = 'when';
      whenSpan.textContent = timeAgo(ev.ts);
      row1.appendChild(whoSpan);
      row1.appendChild(whenSpan);
      row.appendChild(row1);
      if(ev.type === 'msg'){
        var msgP = document.createElement('div');
        msgP.className = 'msg-text';
        msgP.textContent = ev.text;
        row.appendChild(msgP);
      } else {
        var msgP2 = document.createElement('div');
        msgP2.className = 'msg-text';
        msgP2.textContent = isMe ? 'kamu kirim getar' : 'kirim getar ke kamu';
        row.appendChild(msgP2);
      }
      feed.appendChild(row);
    });
  }

  function spawnRing(kind){
    var ring = document.createElement('div');
    ring.className = 'ring' + (kind === 'recv' ? ' recv' : '');
    ring.style.animation = 'burst 0.7s ease-out forwards';
    stage.insertBefore(ring, buzzBtn);
    setTimeout(function(){ ring.remove(); }, 750);
  }

  function beep(freq){
    try{
      var Ctx = window.AudioContext || window.webkitAudioContext;
      var ctx = new Ctx();
      var osc = ctx.createOscillator();
      var gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq || 660;
      gain.gain.setValueAtTime(0.001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.25);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start();
      osc.stop(ctx.currentTime + 0.26);
    } catch(e){}
  }

  function triggerSendFeedback(){
    spawnRing('send'); spawnRing('send');
    if('vibrate' in navigator){ navigator.vibrate(35); }
  }

  function triggerReceiveBuzz(){
    spawnRing('recv'); spawnRing('recv');
    buzzBtn.classList.add('recv-flash');
    setTimeout(function(){ buzzBtn.classList.remove('recv-flash'); }, 400);
    flashOverlay.style.transition = 'opacity 0.08s';
    flashOverlay.style.opacity = '0.12';
    setTimeout(function(){ flashOverlay.style.opacity = '0'; }, 150);
    if('vibrate' in navigator){ navigator.vibrate([0,80,50,80,50,160]); }
    beep(660);
  }

  function triggerReceiveMsg(){
    if('vibrate' in navigator){ navigator.vibrate(25); }
    beep(880);
  }

  async function loadInitial(){
    try{
      var res = await window.storage.get(storageKey, true);
      if(res && res.value){
        var events = JSON.parse(res.value);
        events.forEach(function(ev){ processedIds[ev.id] = true; feedItems.push(ev); });
        renderFeed();
      }
    } catch(e){ /* no history yet */ }
  }

  async function poll(){
    try{
      var res = await window.storage.get(storageKey, true);
      if(!res || !res.value) return;
      var events = JSON.parse(res.value);
      var changed = false;
      events.forEach(function(ev){
        if(processedIds[ev.id]) return;
        processedIds[ev.id] = true;
        feedItems.push(ev);
        changed = true;
        if(!mySentIds[ev.id]){
          if(ev.type === 'buzz') triggerReceiveBuzz();
          else triggerReceiveMsg();
        }
      });
      if(changed) renderFeed();
    } catch(e){ /* ignore transient errors */ }
  }

  async function pushEvent(ev){
    var arr = [];
    try{
      var res = await window.storage.get(storageKey, true);
      if(res && res.value) arr = JSON.parse(res.value);
    } catch(e){ arr = []; }
    arr.push(ev);
    if(arr.length > 60) arr = arr.slice(-60);
    var setRes = await window.storage.set(storageKey, JSON.stringify(arr), true);
    return !!setRes;
  }

  buzzBtn.addEventListener('click', async function(){
    var id = Date.now() + '-' + Math.random().toString(36).slice(2,8);
    var ev = { id: id, from: nickname, ts: Date.now(), type: 'buzz' };
    mySentIds[id] = true;
    triggerSendFeedback();
    try{
      var ok = await pushEvent(ev);
      if(!ok){ showToast('Gagal mengirim getar'); return; }
      processedIds[id] = true;
      feedItems.push(ev);
      renderFeed();
    } catch(e){ showToast('Gagal mengirim getar'); }
  });

  async function sendMessage(){
    var text = msgInput.value.trim();
    if(!text) return;
    var id = Date.now() + '-' + Math.random().toString(36).slice(2,8);
    var ev = { id: id, from: nickname, ts: Date.now(), type: 'msg', text: text };
    mySentIds[id] = true;
    msgInput.value = '';
    try{
      var ok = await pushEvent(ev);
      if(!ok){ showToast('Pesan gagal terkirim'); return; }
      processedIds[id] = true;
      feedItems.push(ev);
      renderFeed();
    } catch(e){ showToast('Pesan gagal terkirim'); }
  }
  sendMsgBtn.addEventListener('click', sendMessage);
  msgInput.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ sendMessage(); }
  });

  init();
})();
</script>

</body>
</html>
